<html>
    <body>
        <h2>Call Stack</h2>
        <p id="demo"></p>
        <script>
            function add(a, b) {
                return a + b;
            }



            function  average(a, b) {
                return add(a, b) / 2;
            }

            document.getById("demo").innerHTML = average(10, 20);
            
        </script>
    </body>

</html>
