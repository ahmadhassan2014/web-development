<html>
    <head>
        <tittle>My delivery Tracker</tittle>
        <style>
            body {
                text-align: center;
                padding: 30px;
            }

            h1{
                color: #ff5a43;
            }

            button {
                background-color: #ff5a43;
                color: white;
                padding: 10px 25px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
                margin: 10px;
            }

            div {
                border: 1px solid #ff5a43;
                width: 280px;
                margin: 6px auto;
                padding:8px 12px;
                text-align: left;
                border-radius: 6px;
            }
        </style>
    </head>


    <body>
      
        <h1>My Delivery Tracker</h1>
        <button onclick="saveOrder()">Save Order</button>


        <div>JSON Text: <span id="json-text"></span></div>
        <div>Loaded Item: <span id="loaded-text"></span></div>
        <div>Loaded Price: <span id="loaded-price"></span></div>

        <script>
            let order = {
                item: "Pizza",
                price: 5,
                shop: "My snack shop"
            };

            function saveOrder() {
                let jsonText = JSON.styingify(order);
                let loadedOrder = JSON.parse(jsonText);
            

            document.getElementById("json-text").innerHTML = jsontext;
            document.getElementById("loaded-item").innerHTML = loadedOrder.item;
            document.getElementById("loaded-price").innerHTML = "$" + loadedOrder.price;}
        </script>
    </body>
</html>
