<html>
    <body>
        <h2>javascript for loops</h2>
        <p> id="demo"</p>
        <script>
            var fruits = ["Apple", "Banana", "Mango", "Grappes", "Watermelon", "Jack Fruit"];
            var text = "";

            for(let i = 0; i < fruits.length; i++){
                text = text + fruits[i] + "<br>"
            }
            document.getElementById("demo").innerHTML = text;
        </script>
    </body>
</html>
