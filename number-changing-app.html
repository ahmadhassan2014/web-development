<html>
<head>
    <title>Changing Number App</title>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #333;
        }

        h1 {
            color: #444;
        }

        #number {
            font-size: 60px;
            color: #764ba2;
            cursor: pointer;
            margin: 25px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #764ba2;
        }

        p {
            color: gray;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Number Changer</h1>

        <h2 id="number" onclick="toggleNumber()">0</h2>

        <button onclick="toggleNumber()" id="btn">
            Stop
        </button>

        <p>Click the number or button to stop/start</p>

    </div>

    <script>
        let number = 0;
        let running = true;

        let timer = setInterval(changeNumber, 500);

        function changeNumber() {
            if (running) {
                number++;
                document.getElementById("number").innerText = number;
            }
        }

        function toggleNumber() {
            running = !running;

            document.getElementById("btn").innerText =
                running ? "Stop" : "Start";
        }
    </script>

</body>
</html>
