<html>
    <head>
        <tittle> My Planet Card</tittle>
    
    <style>
        body {
            text-align: center;
        }
        h1 { color:#ff5a43}
        p { color:#555}

        button {
            background-color: #ff5a43;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
    </head>

    <body>
        <h1>My Planet Card</h1>
        <p>Use a JavaScript class to build planet cards!</p>
        <button onclick="showPlanets()">show Planets!</button>
        <div class="cards">
            <div id="card1"></div>
            <div id="card2"></div>
        </div>
        <script>
            class Planet {
                constructor(name, fact) {
                    this.name = name;
                    this.fact = fact;
                }
                describe() {
                    return this.name + ": " + this.fact;
                }
            }

            function showPlanets() {
                let p1 = new planet("Earth", "The only plante5t whith life");
                let p2 = new planet("Mars", "Known as the red planet");

                document.getElementById("card1").innerHTML = p1.describe() + "<br>";
                document.getElementById("card2").innerHTML = p2.describe() + "<br>";
            }


        </script>
    </body>
</html>
