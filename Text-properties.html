<html>
    <head>
        <title>Typograph</title>
        <style>
            body{
                background-color:darkblue;
                color: white;
                 font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif

            
            }

            .hero-name{
                font-size:60px;
                font-weight:bold;
                color:yellow;
                text-shadow: 3px 3px orange;

            }

            .tag-line{
                font-style:italic;
                color:lightblue;
                text-transform:capitalize;
            }

            .label{
                text-transform:uppercase;
                text-decoration:underline;
                color:coral


            }

            .power{
                font-weight:bold;
                color:lightgreen;
            }

            .weekness{
                text-decoration:line-throught;
                color:gray;
            }

            .badge{
                font-size:28px;
                font-weight:bold;
                color:gold;
                transform:rotate(15deg);
            }

            .made-by{
                color:coral;
                font-style:italic;

            }


        </style>
    </head>
    <body>
        
        <h1 class="hero-name">Thunder kid"</h1>
        <p class="tag-line">The most powerful hero in schol</p>

        <h2 class="label">super power</h2>
        <p class="power">Can run fast than a cheetah</p>
        <p class="power">Can lift a school bus</p>

        <h2 class="label">Weekness</h2>
        <p class="weekness">Mathswork</p>
         <p class="weekness">Broocoli</p>
          
         <p class="badge">Top hero</p>
          
         <p class="made-by">Created by_________</p>
    </body>
</html>
