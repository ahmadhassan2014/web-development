<html>
<head>
<title>My Calendar</title>
<style>
body {
    font-family: Arial;
    background: #dbeafe;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.calendar {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
    box-shadow: 0 5px 15px #999;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 8px;
    border-radius: 5px;
    cursor: pointer;
}
.days, .week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    gap: 5px;
}
.week div {
    font-weight: bold;
    padding: 10px 0;
}
.days div {
    padding: 10px 0;
    border-radius: 5px;
    cursor: pointer;
}
.days div:hover {
    background: #bfdbfe;
}
.today {
    background: #2563eb;
    color: white;
}
</style>
</head>
<body>

<div class="calendar">
    <div class="header">
        <button onclick="change(-1)">❮</button>
        <h3 id="month"></h3>
        <button onclick="change(1)">❯</button>
    </div>

    <div class="week">
        <div>Sun</div><div>Mon</div>
        <div>Tue</div><div>Wed</div>
        <div>Thu</div><div>Fri</div>
        <div>Sat</div>
    </div>

    <div class="days" id="days"></div>
</div>

<script>
let date = new Date();

function showCalendar() {
    let year = date.getFullYear();
    let month = date.getMonth();

    document.getElementById("month").innerHTML =
        date.toLocaleString("default", {
            month: "long", year: "numeric"
        });

    let first = new Date(year, month, 1).getDay();
    let total = new Date(year, month + 1, 0).getDate();

    let html = "";

    for (let i = 0; i < first; i++)
        html += "<div></div>";

    for (let i = 1; i <= total; i++) {
        let today = new Date();
        let cls = (i === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear())
            ? "today" : "";

        html += `<div class="${cls}">${i}</div>`;
    }

    document.getElementById("days").innerHTML = html;
}

function change(n) {
    date.setMonth(date.getMonth() + n);
    showCalendar();
}

showCalendar();
</script>

</body>
</html>
