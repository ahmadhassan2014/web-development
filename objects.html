<html lang="en">
    <head>
  <meta charset="UTF-8">
 <title>My Phone Contact</title>
 <link
   href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
   rel="stylesheet">
 <style>
    body { background-color: #F0F0F2}
    h1  { color: #FF5A43 }
    .card-label { font-size: 11px; color: #999; text-transform: uppercase;}
 </style>
    </head>

    <body class="p-4">
        <div class="container">
            <h1 class="mb-3">My Phone Contact</h1>
            <div class="card mb-3" style="max-width:400px">
                <div class="card-body">
                    <h5 class="card-title" style="color:#FF5A43";>Contact Details</h5>
                    <ul class="list-group">
                        <li class="list-group-item;">
                            <span class="card-label d-block">Name</span>
                            <strong id="name">-</strong>
                        </li>

                    </ul> <li class="list-group-item">
           <span class="card-label d-block">Phone</span>
           <strong id="phone">—</strong>
         </li>


                </div>
            </div>
        </div>

         <script>


   var myContact = {
     name:   "Ali Khan",
     phone:  "98765-43210",
   };


   var nameEl  = document.getElementById("name");
   var phoneEl = document.getElementById("phone");
   nameEl.textContent  = myContact.name;
   phoneEl.textContent = myContact.phone;
 </script>


    </body>
</html>
